name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  ai-review:
    if: startsWith(github.head_ref, 'test-')

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip3 install requests

      - name: Run AI Review
        env:
          OLLAMA_HOST: http://host.docker.internal:11434
          OLLAMA_MODEL: qwen3-coder:480b-cloud
        run: |
          python3 tools/review_agent.py

  build:
    if: startsWith(github.head_ref, 'test-')

    needs: ai-review

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Game
        run: |
          g++ src/*.cpp -o game \
            -lraylib \
            -lGL \
            -lm \
            -lpthread \
            -ldl \
            -lrt \
            -lX11