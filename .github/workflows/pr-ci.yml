name: PR CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - develop

jobs:

  ai-review:
    if: startsWith(github.head_ref, 'test-')

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --user requests

      - name: Verify Ollama Connectivity
        run: |
          echo "Testing Ollama..."
          curl http://host.docker.internal:11434/api/tags

      - name: Run AI Review
        env:
          OLLAMA_HOST: http://host.docker.internal:11434
          OLLAMA_MODEL: qwen3-coder:480b-cloud
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 tools/review_agent.py

      - name: Post or Update AI Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            if (!fs.existsSync('review.md')) {
              console.log('review.md not found');
              return;
            }

            const body = fs.readFileSync(
              'review.md',
              'utf8'
            );

            const comments =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number:
                  context.payload.pull_request.number
              });

            const existing =
              comments.data.find(
                c =>
                  c.user.type === 'Bot' &&
                  c.body.includes('# AI Code Review')
              );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number:
                  context.payload.pull_request.number,
                body
              });
            }

  build:
    if: startsWith(github.head_ref, 'test-')

    needs: ai-review

    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Raylib Installation
        run: |
          echo "Checking raylib..."

          find /usr/local/include \
            -name raylib.h

          find /usr/local/lib \
            -name "libraylib*"

      - name: Build Game
        run: |
          g++ src/*.cpp \
            -o game \
            -lraylib \
            -lGL \
            -lm \
            -lpthread \
            -ldl \
            -lrt \
            -lX11

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: game-binary
          path: game