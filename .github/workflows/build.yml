name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          g++ src/*.cpp -o game \
            -lraylib \
            -lGL \
            -lm \
            -lpthread \
            -ldl \
            -lrt \
            -lX11