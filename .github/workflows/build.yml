name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python
        run: python3 --version

      - name: Verify AI Review Script Exists
        run: |
          test -f tools/ai_review.py
          test -f tools/review_agent.py

      - name: Verify Hooks Exist
        run: |
          test -f .git-hooks/pre-commit
      
      - name: Python Syntax Check
        run: |
          python3 -m py_compile tools/ai_review.py
          python3 -m py_compile tools/review_agent.py